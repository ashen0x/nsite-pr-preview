<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nsite-pr-preview</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.6 ui-sans-serif, system-ui, sans-serif;
      }
      main { padding: 2rem; max-width: 34rem; }
      h1 { font-size: 1.5rem; margin: 0 0 1rem; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem; margin: 0; }
      dt { opacity: 0.6; }
      dd { margin: 0; font-family: ui-monospace, monospace; }
      p { opacity: 0.6; margin: 1.5rem 0 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>nsite-pr-preview</h1>
      <dl>
        <dt>branch</dt>
        <dd>{{branch}}</dd>
      </dl>
      <p>
        A pull request build, published as its own nsite under the publisher's
        key and served by any nsite gateway.
      </p>
    </main>
  </body>
</html>
